apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: fastapi-app
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: backend:latest
          imagePullPolicy: Never
          command: ["bash", "scripts/prestart.sh"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
